<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Launcher 風 UI</title>
    <style>
        /* 全体のリセットと基本設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1e1e1e;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* ランチャー全体のコンテナ */
        .launcher-container {
            width: 1000px;
            height: 620px;
            background-color: #2c2c2c;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #3c3c3c;
        }

        /* メインコンテンツエリア（サイドバー ＋ 画面） */
        .main-content {
            display: flex;
            flex: 1;
            height: calc(100% - 80px); /* プレイバーの分を引く */
        }

        /* サイドナビゲーション */
        .sidebar {
            width: 220px;
            background-color: #1a1a1a;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top-left-radius: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #aaaaaa;
            transition: background 0.2s, color 0.2s;
        }

        .nav-item:hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        .nav-item.active {
            background-color: #383838;
            color: #ffffff;
            border-left: 4px solid #4caf50;
            padding-left: 11px;
        }

        /* 中央のダッシュボード（ニュースなど） */
        .content-body {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('https://unsplash.com') center/cover;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .logo-area img {
            width: 320px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .news-card {
            background-color: rgba(30, 30, 30, 0.85);
            padding: 20px;
            border-radius: 6px;
            max-width: 450px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .news-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .news-card p {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.5;
        }

        /* 下部のプレイバー（起動オプション、プレイボタン） */
        .play-bar {
            height: 80px;
            background-color: #232323;
            border-top: 1px solid #333333;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        /* バージョン選択セレクトボックス */
        .version-selector {
            background-color: #313131;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            min-width: 200px;
        }

        .version-selector:hover {
            background-color: #3a3a3a;
            border-color: #555555;
        }

        /* 圧倒的マイクラ風プレイボタン */
        .play-button {
            background-color: #3c8527;
            border: none;
            border-bottom: 4px solid #275419;
            color: #ffffff;
            padding: 12px 60px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: background 0.1s, transform 0.1s;
        }

        .play-button:hover {
            background-color: #469b2e;
        }

        .play-button:active {
            border-bottom-width: 0px;
            margin-top: 4px;
            background-color: #347322;
        }

        /* ユーザープロファイル（簡易表示） */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #555555;
            border-radius: 4px;
            border: 2px solid #888888;
            /* スティーブの顔URL（ダミー） */
            background-image: url('https://minotar.net');
            background-size: cover;
        }
    </style>
</head>
<body>

    <div class="launcher-container">
        
        <!-- メイン画面（サイドバーとコンテンツ） -->
        <div class="main-content">
            
            <!-- 左側ナビゲーション -->
            <div class="sidebar">
                <div class="nav-item active">Eaglercraft Version</div>
                <div class="nav-item">Minecraft for Windows</div>
                <div class="nav-item">Minecraft Dungeons</div>
                <div style="margin-top: auto;" class="nav-item">設定</div>
            </div>

            <!-- 中央メイン画面（背景画像付き） -->
            <div class="content-body">
                <div class="logo-area">
                    <!-- Java Editionのロゴイメージ -->
                    <img src="https://wikimedia.org" alt="Minecraft Java Edition">
                </div>

            </div>

        </div>

        <!-- 下部固定の起動・プレイバー -->
        <div class="play-bar">
            
            <!-- バージョン選択 -->
            <select class="version-selector">
                <option>最新のリリース (1.21.x)</option>
                <option>最新のスナップショット</option>
                <option>Forge - 1.20.1</option>
                <option>Fabric - 1.21</option>
            </select>

            <!-- プレイボタン -->
            <button class="play-button" onclick="launchGame()">プレイ</button>

            <!-- プレイヤー情報 -->
            <div class="user-profile">
                <div class="avatar"></div>
                <span>Player_Steve</span>
            </div>

        </div>

    </div>

    <script>
        function launchGame() {
            const btn = document.querySelector('.play-button');
            btn.innerText = '準備中...';
            btn.style.backgroundColor = '#666';
            btn.style.borderBottomColor = '#444';
            btn.disabled = true;

            setTimeout(() => {
                alert('マインクラフトを起動しています...');
                btn.innerText = 'プレイ';
                btn.style.backgroundColor = '#3c8527';
                btn.style.borderBottomColor = '#275419';
                btn.disabled = false;
            }, 1500);
        }
    </script>
</body>
</html>
