<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATTA-Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .launcher-container {
            width: 1000px;
            height: 620px;
            background-color: #2c2c2c;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #3c3c3c;
        }

        .main-content {
            display: flex;
            flex: 1;
            height: calc(100% - 80px);
        }

        .sidebar {
            width: 220px;
            background-color: #141414;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top-left-radius: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #aaaaaa;
            transition: background 0.2s, color 0.2s;
        }

        .nav-item:hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        .nav-item.active {
            background-color: #383838;
            color: #ffffff;
            border-left: 4px solid #4caf50;
            padding-left: 11px;
        }
        /* 中央のダッシュボード（マインクラフトの草ブロック画像に変更） */
        .content-body {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), 
                        url('https://preview.redd.it/my-wallpaper-designed-in-my-survival-world-v0-ic79vuf66ap31.png?width=640&crop=smart&auto=webp&s=95399d26ac841b2255c27fd3e1aaf4d2a845f225') center/cover;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }


        .logo-area {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .logo-area img {
            width: 320px;
            height: auto;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
        }

        .launcher-sub-title {
            font-size: 16px;
            font-weight: bold;
            color: #4caf50;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-left: 5px;
            letter-spacing: 1px;
        }

        .news-card {
            background-color: rgba(20, 20, 20, 0.85);
            padding: 20px;
            border-radius: 6px;
            max-width: 450px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .news-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .news-card p {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.5;
        }

        .play-bar {
            height: 80px;
            background-color: #1e1e1e;
            border-top: 1px solid #2d2d2d;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .version-selector {
            background-color: #2b2b2b;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            width: 260px;
            max-width: 260px;
        }

        .version-selector:hover {
            background-color: #363636;
            border-color: #555555;
        }

        .play-button {
            background-color: #3c8527;
            border: none;
            border-bottom: 4px solid #275419;
            color: #ffffff;
            padding: 12px 50px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: background 0.1s, transform 0.1s;
        }

        .play-button:hover {
            background-color: #469b2e;
        }

        .play-button:active {
            border-bottom-width: 0px;
            margin-top: 4px;
            background-color: #347322;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 220px;
            justify-content: flex-end;
        }

        .name-input {
            background-color: #2b2b2b;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            width: 140px;
            outline: none;
            user-select: text;
        }

        .name-input:focus {
            border-color: #4caf50;
            background-color: #333333;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #555555;
            border-radius: 4px;
            border: 2px solid #888888;
            background-image: url('https://minotar.net/avatar/char/32');
            background-size: cover;
        }
    </style>
</head>

    <script>
          window.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem('BattaLauncher_LastUsername');
        if (savedName) {
            document.getElementById('playerNameInput').value = savedName;
        }
    });

    function launchGame() {
        const selectEl = document.getElementById('versionSelect');
        const targetHtml = selectEl.value;

        let username = document.getElementById('playerNameInput').value.trim();
        if (!username) username = "Player";

        // ランチャー側に入力を記憶
        localStorage.setItem('BattaLauncher_LastUsername', username);

        // 【最強設定】ありとあらゆるWeb版マイクラのユーザー名キーに強制書き込み
        const keys = [
            'username', 'profile_username', 'eagler_username', 'wispcraft_username',
            'player_username', 'playerName', 'player', 'name', 'nick', 'nickname',
            'mcl_username', 'user', 'saved_username', 'cached_username'
        ];
        
        keys.forEach(key => {
            try {
                localStorage.setItem(key, username);
                sessionStorage.setItem(key, username);
            } catch(e) {}
        });

        // 起動ボタンのアニメーション
        const btn = document.querySelector('.play-button');
        btn.innerText = '起動中...';
        btn.style.backgroundColor = '#666';
        btn.style.borderBottomColor = '#444';
        btn.disabled = true;

        // 1秒後にゲームに移動
        setTimeout(() => {
            window.location.href = targetHtml;
        }, 1000);
    }
    </script>
</body>
</html>
